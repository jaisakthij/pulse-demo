name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Check out LongitudinalGeneration dependency
        uses: actions/checkout@v4
        with:
          repository: jaisakthij/LongitudinalGeneration
          path: LongitudinalGeneration
          fetch-depth: 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f LongitudinalGeneration/requirements.txt ]; then pip install -r LongitudinalGeneration/requirements.txt; fi

      - name: Run tests
