name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout pulse-demo repository
      uses: actions/checkout@v4
      with:
        repository: jaisakthij/pulse-demo
        path: pulse-demo
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'
    - name: Checkout LongitudinalGeneration dependency
      uses: actions/checkout@v4
      with:
        repository: jaisakthij/LongitudinalGeneration
        path: LongitudinalGeneration
